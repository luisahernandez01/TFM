name: tfm_soccermon
version: "1.0.0"
config-version: 2
profile: tfm_soccermon

model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # carpeta con silver_objetivo.parquet y silver_subjetivo.parquet (relativa a donde se corre dbt)
  data_dir: "../data"
  # umbrales de calidad de una sesión válida
  min_duracion_min: 20
  max_gps_invalido: 0.2
  # plausibilidad física: por encima se considera error de sensor
  max_speed_ms: 12
  max_duracion_min: 240

models:
  tfm_soccermon:
    staging:
      +materialized: table
    gold:
      +materialized: table
